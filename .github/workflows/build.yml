name: Build ImmortalWrt with MediaTek Proprietary WiFi (padavanonly)

on:
  workflow_dispatch:
    inputs:
      clean:
        description: 'Clean build (full rebuild)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
          file wget time

    # ========== CACHE ==========
    - name: Cache toolchain and packages
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/build_dir
          openwrt/staging_dir
          openwrt/tmp
        key: padavanonly-build-${{ runner.os }}-${{ hashFiles('openwrt/feeds.conf*') }}
        restore-keys: |
          padavanonly-build-${{ runner.os }}-

    # ========== SOURCE (padavanonly - has proprietary WiFi) ==========
    - name: Clone ImmortalWrt source (padavanonly)
      run: |
        git clone https://github.com/padavanonly/immortalwrt-mt798x-6.6.git openwrt
        cd openwrt
        git checkout openwrt-24.10
        cd ..

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        cd ..

    # ========== CONFIGURE FOR 360T7 ==========
    - name: Configure for 360T7
      run: |
        cd openwrt
        cat >> .config << 'EOF'
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_mt7981=y
CONFIG_TARGET_mediatek_mt7981_DEVICE_qihoo_360t7=y
CONFIG_TARGET_IMAGES_GZIP=y
CONFIG_TARGET_ROOTFS_SQUASHFS=y
EOF
        make defconfig
        cd ..

    # ========== DOWNLOAD SOURCES ==========
    - name: Download all sources
      run: |
        cd openwrt
        make download -j8
        cd ..

    # ========== CLEAN (if requested) ==========
    - name: Clean build (if requested)
      if: github.event.inputs.clean == 'true'
      run: |
        cd openwrt
        make clean
        cd ..

    # ========== BUILD ==========
    - name: Build firmware
      run: |
        cd openwrt
        make V=s -j$(nproc)
        cd ..

    # ========== FIND AND DISPLAY FILES ==========
    - name: Find sysupgrade file
      run: |
        echo "========================================="
        echo "Looking for sysupgrade.bin..."
        find openwrt/bin -name "*sysupgrade.bin" -ls 2>/dev/null || echo "Not found"
        echo "---"
        echo "All .bin files:"
        find openwrt/bin -name "*.bin" -ls 2>/dev/null || echo "No .bin files"
        echo "========================================="

    # ========== UPLOAD ARTIFACTS ==========
    - name: Upload sysupgrade image
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-360t7-proprietary-wifi
        path: |
          openwrt/bin/**/*sysupgrade.bin
          openwrt/bin/**/*factory.bin
        compression-level: 0
        if-no-files-found: warn

    - name: Upload full bin directory
      uses: actions/upload-artifact@v4
      with:
        name: full-bin-directory
        path: openwrt/bin/
        compression-level: 0

    # ========== CREATE RELEASE ==========
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: build-${{ github.run_number }}-${{ github.run_id }}
        name: ImmortalWrt 360T7 - Proprietary WiFi Driver
        body: |
          ## ImmortalWrt for 360T7 with **MediaTek Proprietary WiFi Driver**
          
          - **Source**: padavanonly/immortalwrt-mt798x-6.6
          - **Kernel**: 6.6
          - **WiFi Driver**: **Proprietary (Closed Source) from MediaTek**
          - **Performance**: ~900+ Mbps (much faster than open source mt76)
          
          ### Installation
          1. Enter U-Boot (custom/hanwckf uboot)
          2. Upload the `*sysupgrade.bin` file
          3. Wait for flashing to complete
          
          ### Features
          - High-performance WiFi (MediaTek proprietary driver)
          - Hardware NAT (HNAT) acceleration
          - Full Mesh/WDS support
        files: |
          openwrt/bin/**/*sysupgrade.bin
          openwrt/bin/**/*factory.bin
        fail_on_unmatched_files: false
