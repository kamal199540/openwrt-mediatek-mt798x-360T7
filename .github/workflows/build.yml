name: Build ImmortalWrt 360T7 - Stable (Proprietary WiFi)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 200
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
          file wget time

    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/build_dir
          openwrt/staging_dir
        key: stable-360t7-${{ runner.os }}

    - name: Clone source (padavanonly - openwrt-24.10)
      run: |
        git clone -b openwrt-24.10 https://github.com/padavanonly/immortalwrt-mt798x-6.6.git openwrt

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure for 360T7
      run: |
        cd openwrt
        cat >> .config << 'EOF'
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_mt7981=y
CONFIG_TARGET_mediatek_mt7981_DEVICE_qihoo_360t7=y
CONFIG_TARGET_IMAGES_GZIP=y
CONFIG_TARGET_ROOTFS_SQUASHFS=y
EOF
        make defconfig

    - name: Download sources
      run: |
        cd openwrt
        make download -j8

    - name: Build
      run: |
        cd openwrt
        make V=s -j$(nproc)

    - name: Upload sysupgrade
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-360t7-stable-proprietary
        path: openwrt/bin/targets/**/*sysupgrade.bin

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: stable-${{ github.run_number }}
        name: ImmortalWrt 360T7 - Stable Proprietary WiFi
        body: |
          ## النظام المستقر النهائي لجهاز 360T7
          - **مبني من:** padavanonly/immortalwrt-mt798x-6.6 (فرع openwrt-24.10)
          - **سائق الواي فاي:** مغلق (Proprietary) – أداء عالي
          - **يعمل مباشرة مع Uboot المخصص ("هانك")**
          - **مستقر ومجرب**
        files: |
          openwrt/bin/targets/**/*sysupgrade.bin
